name: Update dashboard data

on:
  # 매일 06:00 KST(= 전날 21:00 UTC) 자동 갱신 — 방문자 + 소비 데이터 통합.
  # 로컬(Mac) 스케줄 작업은 은퇴(샌드박스에서 SSH/API 키 접근 불가). 이 워크플로가 단일 소스.
  # 리아 성과 피드는 1일 2회(09:30 / 21:30 KST) 추가 — 리아 운영 캐던스와 정합.
  # 관광 데이터(data.go.kr, 수집 ~15분)는 06:00 KST 회차와 수동 실행에서만 돈다.
  schedule:
    - cron: "0 21 * * *"    # 06:00 KST — 관광 데이터 + 리아
    - cron: "30 0 * * *"    # 09:30 KST — 리아만 (오전 엔진 후)
    - cron: "30 12 * * *"   # 21:30 KST — 리아만 (저녁 게시 후)
  workflow_dispatch: {}     # 수동 실행 버튼 (전체 수집)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 리아 성과 대시보드 — 매 회차 실행.
      # 토큰 미설정 시 스크립트가 피드를 건드리지 않고 정상 종료하므로 워크플로가 깨지지 않는다.
      #
      # [2026-08-06 순서 교체] 이 스텝은 원래 data.go.kr 두 스텝 뒤에 있었다.
      # 그 결과 06:00 KST 회차에서 관광 데이터 수집이 죽으면 job이 거기서 멈춰
      # 리아 수집까지 통째로 날아갔다(8/2·8/4·8/5 실패 회차에서 확인).
      # 리아를 앞에 두면 관광 쪽이 죽어도 리아 수집은 끝난 뒤다.
      - name: Fetch Ria IG performance
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          RIA_BASELINE_FOLLOWERS: ${{ vars.RIA_BASELINE_FOLLOWERS }}
        run: python scripts/fetch_ria_kpi.py

      - name: Fetch visitor data from data.go.kr
        if: github.event.schedule == '0 21 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ANCHOR_AREA_CD: ${{ vars.ANCHOR_AREA_CD }}
          ANCHOR_SIGNGU_CD: ${{ vars.ANCHOR_SIGNGU_CD }}
        run: python scripts/fetch_data.py

      - name: Fetch consume data from data.go.kr
        if: github.event.schedule == '0 21 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_consume.py

      # 앞 스텝이 실패해도 그때까지 모인 데이터는 커밋한다.
      # continue-on-error 를 쓰지 않는 이유: job 이 green 이 되어 실패 알림이 끊긴다.
      # 여기서는 부분 데이터를 저장하되 job 은 red 로 남겨 문제를 계속 드러낸다.
      - name: Commit if changed
        if: '!cancelled()'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "chore: auto-update dashboard data ($(date -u +%Y-%m-%d))"
          # 실행 중(수집 ~15분) 다른 push가 들어와도 거부되지 않도록 rebase 후 push
          git pull --rebase origin main
          git push
